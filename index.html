<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>깃토리의 GitHub 연습장 — GitHub의 모든 기능을 따라 하며 배워요</title>
<meta name="description" content="저장소, 커밋, 브랜치, Pull Request, 이슈, Fork, 터미널 Git, Actions, Pages, 보안까지 — 가상 GitHub에서 미션을 따라 하며 GitHub의 모든 기능을 체험하는 인터랙티브 학습 사이트">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌰</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="tbtn side-tg" data-a="sidetoggle" title="미션 지도">☰</button>
  <div class="brand"><span class="brand-ic">🐿️</span><div><b>깃토리의 GitHub 연습장</b><small>따라 하며 배우는 GitHub 모든 기능</small></div></div>
  <div id="top-stats" class="top-stats"></div>
  <button class="tbtn" data-a="help" title="도움말">❓</button>
  <button class="tbtn" data-a="settings" title="설정">⚙️</button>
</header>
<div class="layout">
  <aside id="side" class="side"></aside>
  <main class="main">
    <section id="guide"></section>
    <div class="browser">
      <div class="bbar">
        <span class="dots"><i></i><i></i><i></i></span>
        <button data-a="navback" title="뒤로">◀</button><button data-a="navfwd" title="앞으로">▶</button><button data-a="navreload" title="새로고침">⟳</button>
        <div class="urlbox">🔒 <span id="url">github.com</span></div>
      </div>
      <div id="gh"></div>
    </div>
    <div id="termwrap" class="termwrap">
      <div class="term-h"><button data-a="termtoggle" class="term-title">⌨️ 터미널 <small>내 컴퓨터 (연습용 가상 PC)</small></button><span class="grow"></span><button data-a="termclear">지우기</button><button data-a="termbig">⇕ 크기</button><button data-a="termtoggle" class="term-arrow">▴</button></div>
      <div class="term"><div id="tout"></div><div class="tin"><span id="tps"></span><input id="tinput" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="터미널 명령 입력" placeholder="여기에 명령어를 입력하고 Enter"></div></div>
    </div>
  </main>
</div>
<div id="modal"></div><div id="toasts"></div><div id="fx"></div>
<script src="js/engine.js"></script>
<script src="js/terminal.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/missions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
